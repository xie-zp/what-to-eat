[project]
name = "what-to-eat"
version = "0.1.0"
description = "基于 LangGraph 和 GraphRAG 的有状态食谱规划 Agent。"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "neo4j>=5.0.0",
    "pydantic>=2.8.0",
    "pymilvus>=2.5.0,<3.0",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
rag = [
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
]
observability = [
    "opentelemetry-api>=1.29.0,<2.0.0",
    "opentelemetry-sdk>=1.29.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0,<2.0.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend", "."]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
