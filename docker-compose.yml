services:
  backend:
    build: .
    container_name: recipe-agent-api
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: all-in-rag
      NEO4J_DATABASE: neo4j
      MILVUS_URI: http://milvus:19530
      MILVUS_COLLECTION: recipe_knowledge
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      EMBEDDING_DIMENSION: "512"
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      USE_NEO4J: "true"
      USE_HYBRID: ${USE_HYBRID:-true}
      USE_LLM_PLANNER: ${USE_LLM_PLANNER:-true}
      USE_LLM_QUERY_ANALYZER: ${USE_LLM_QUERY_ANALYZER:-true}
      USE_LLM_RESPONDER: ${USE_LLM_RESPONDER:-true}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: recipe-agent
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-docker}
      OTEL_EXPORTER: ${OTEL_EXPORTER:-otlp}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
      RECIPE_DATA_PATH: /app/data/generated/recipes.json
      AGENT_DB_PATH: /app/state/agent_state.sqlite3
      CHECKPOINT_DB_PATH: /app/state/checkpoints.sqlite3
    ports:
      - "8020:8000"
    volumes:
      - ./data:/app/data:ro
      - recipe_agent_state:/app/state
      - ${HF_CACHE_PATH:-./.runtime/huggingface}:/root/.cache/huggingface:ro
    depends_on:
      neo4j:
        condition: service_healthy
      milvus:
        condition: service_started

  neo4j:
    image: neo4j:5.18
    container_name: recipe-agent-neo4j
    environment:
      NEO4J_AUTH: neo4j/all-in-rag
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - ./volumes/neo4j/data:/data
      - ./volumes/neo4j/logs:/logs
      - ./volumes/neo4j/plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "all-in-rag", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: recipe-agent-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - ./volumes/etcd:/etcd
    command:
      - etcd
      - -advertise-client-urls=http://etcd:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: recipe-agent-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"

  milvus:
    image: milvusdb/milvus:v2.5.11
    container_name: recipe-agent-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19531:19530"
      - "9092:9091"
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    depends_on:
      - etcd
      - minio

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: recipe-agent-jaeger
    profiles:
      - observability
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  recipe_agent_state:
